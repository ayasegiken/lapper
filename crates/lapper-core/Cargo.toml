[package]
name = "lapper-core"
description = "Timing logic for lapper: course definition, passage assignment, splits, penalties"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }

[features]
# JSON などへの変換（ログの保存と配信に使う）
serde = ["dep:serde"]
# TypeScript の型定義の生成（画面と型を揃えるために使う）。変換の形に合わせるため serde も有効にする
ts = ["serde", "dep:ts-rs"]

[dev-dependencies]
serde_json = "1.0.154"
