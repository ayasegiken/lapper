[package]
name = "lapper-server"
description = "Web server for lapper: stores the event log in SQLite and streams timing results to browsers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
lapper-core = { path = "../lapper-core", features = ["ts"] }
lapper-protocol = { path = "../lapper-protocol" }
lapper-sim = { path = "../lapper-sim" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
